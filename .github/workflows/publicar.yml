name: Publicar tablero

# Revisa el Excel de control en Google Drive y, si cambió, regenera y publica.
on:
  schedule:
    - cron: '*/15 * * * *'        # cada 15 minutos (GitHub puede retrasarlo unos minutos)
  workflow_dispatch:              # botón "Run workflow" para actualizar de inmediato
  push:
    paths:
      - 'datos/origen.json'
      - 'plantilla/**'
      - 'scripts/**'
      - '.github/workflows/publicar.yml'

permissions:
  contents: write

concurrency:
  group: publicar-tablero
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Traer el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install --quiet openpyxl gdown

      - name: Bajar el Excel desde Google Drive
        run: python scripts/descargar.py

      - name: Regenerar el tablero
        run: python scripts/generar.py

      - name: Publicar el corte
        run: |
          git config user.name  "Tablero de plantillas"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html datos/historico.json datos/Control_Plantillas_NetSuite_V1.xlsx
          if git diff --staged --quiet; then
            echo "El Excel de Drive no ha cambiado: no hay nada que publicar."
          else
            git commit -m "Corte del $(TZ=America/Mexico_City date '+%d/%m/%Y %H:%M')"
            git push
            echo "Publicado en https://cateladino.github.io/tablero-plantillas-oracle/"
          fi
